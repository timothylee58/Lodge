spring:
  application.name: claims-service
  datasource:
    url: jdbc:postgresql://localhost:5432/claimdesk
    username: claimdesk
    password: claimdesk
  jpa:
    hibernate.ddl-auto: validate   # Flyway owns the schema
    open-in-view: false
  flyway.enabled: true
  mvc.problemdetails.enabled: true   # validation errors -> RFC 7807 too
  kafka:
    bootstrap-servers: localhost:9092
    producer:
      acks: all
      properties.enable.idempotence: true

claimdesk:
  outbox:
    topic: claims.events
    poll-ms: 1000
    max-attempts: 3   # non-retriable publish failures before a row is dead-lettered
  jwt:
    # No default on purpose: the app refuses to start without JWT_SECRET (>= 32 bytes).
    # Local dev: run with SPRING_PROFILES_ACTIVE=dev (see application-dev.yml).
    secret: ${JWT_SECRET}
    ttl-minutes: 120

management.endpoints.web.exposure.include: health,info,metrics

