# Single origin for the SPA and both APIs: no CORS, and the browser never talks to the services directly.
server {
  listen 80;
  root /usr/share/nginx/html;

  # CSP: Angular injects component styles at runtime, hence 'unsafe-inline' for styles only. No inline scripts.
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy no-referrer always;

  # Append the real client address; claims-service trusts it only because this container's IP is configured
  # as its single trusted proxy (see docker-compose.yml).
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_set_header Host $host;

  location /api/reports/ { proxy_pass http://reporting-service:8081; }
  location /api/ops/dead-letters { proxy_pass http://reporting-service:8081; }
  location /api/ { proxy_pass http://claims-service:8080; }

  location = /index.html { add_header Cache-Control "no-cache" always; add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always; add_header X-Content-Type-Options nosniff always; }
  location / { try_files $uri $uri/ /index.html; }
}
